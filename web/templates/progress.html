{% extends "base.html" %}
{% set active_page = "investigate" %}
{% block title %}Investigation Progress — OSINT Pipeline{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto" x-data="progressTracker()" x-init="connect()">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-2xl font-bold text-white">Investigation Progress</h2>
            <p class="text-sm text-gray-400 mt-1">Target: <span class="text-brand-cyan font-medium">{{ investigation.target }}</span></p>
        </div>
        <div class="flex items-center gap-3">
            <template x-if="!done">
                <span class="flex items-center gap-2 text-sm text-blue-400">
                    <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse-dot"></span>
                    Running
                </span>
            </template>
            <template x-if="done && !failed">
                <a href="/reports/{{ investigation.id }}" class="gradient-brand text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition">
                    View Report
                </a>
            </template>
        </div>
    </div>

    <!-- Stage Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <template x-for="stage in stages" :key="stage.name">
            <div class="bg-gray-900 border rounded-xl p-5 transition-all"
                 :class="{
                     'border-gray-800': stage.status === 'pending',
                     'border-blue-700 shadow-lg shadow-blue-900/20': stage.status === 'active',
                     'border-emerald-700': stage.status === 'done',
                     'border-red-700': stage.status === 'failed'
                 }">
                <div class="flex items-center gap-2 mb-3">
                    <template x-if="stage.status === 'pending'">
                        <span class="w-3 h-3 rounded-full bg-gray-600"></span>
                    </template>
                    <template x-if="stage.status === 'active'">
                        <span class="w-3 h-3 rounded-full bg-blue-400 animate-pulse-dot"></span>
                    </template>
                    <template x-if="stage.status === 'done'">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                    </template>
                    <template x-if="stage.status === 'failed'">
                        <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                    </template>
                    <span class="text-xs font-bold uppercase tracking-wider"
                          :class="{
                              'text-gray-500': stage.status === 'pending',
                              'text-blue-400': stage.status === 'active',
                              'text-emerald-400': stage.status === 'done',
                              'text-red-400': stage.status === 'failed'
                          }"
                          x-text="stage.name"></span>
                </div>
                <p class="text-xs text-gray-500 min-h-[2rem]" x-text="stage.message || 'Waiting...'"></p>
            </div>
        </template>
    </div>

    <!-- Log Stream -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
        <div class="px-5 py-3 border-b border-gray-800 flex items-center justify-between">
            <h3 class="text-sm font-semibold text-white">Event Log</h3>
            <span class="text-xs text-gray-500" x-text="logs.length + ' events'"></span>
        </div>
        <div class="p-4 max-h-96 overflow-y-auto font-mono text-xs space-y-1" id="log-container">
            <template x-for="(log, i) in logs" :key="i">
                <div class="flex gap-3">
                    <span class="text-gray-600 flex-shrink-0" x-text="log.ts?.substring(11, 19) || ''"></span>
                    <span class="font-semibold flex-shrink-0"
                          :class="{
                              'text-blue-400': log.status === 'active' || log.status === 'started',
                              'text-emerald-400': log.status === 'done' || log.status === 'completed',
                              'text-red-400': log.status === 'failed',
                              'text-gray-400': !['active','started','done','completed','failed'].includes(log.status)
                          }"
                          x-text="'[' + log.stage + ']'"></span>
                    <span class="text-gray-300" x-text="log.message"></span>
                </div>
            </template>
            <template x-if="logs.length === 0">
                <p class="text-gray-600">Connecting...</p>
            </template>
        </div>
    </div>
</div>

<script>
function progressTracker() {
    return {
        stages: [
            { name: 'RECON', status: 'pending', message: '' },
            { name: 'HARVESTING', status: 'pending', message: '' },
            { name: 'ANALYST', status: 'pending', message: '' },
            { name: 'SCRIBE', status: 'pending', message: '' },
        ],
        logs: [],
        done: false,
        failed: false,

        connect() {
            const invId = '{{ investigation.id }}';
            const es = new EventSource(`/api/investigate/${invId}/stream`);

            es.addEventListener('update', (e) => {
                const data = JSON.parse(e.data);
                this.logs.push(data);

                const stageIdx = this.stages.findIndex(s => s.name === data.stage);
                if (stageIdx >= 0) {
                    this.stages[stageIdx].status = data.status === 'completed' ? 'done' : data.status;
                    this.stages[stageIdx].message = data.message;

                    if (data.status === 'active') {
                        for (let i = 0; i < stageIdx; i++) {
                            if (this.stages[i].status !== 'failed') {
                                this.stages[i].status = 'done';
                            }
                        }
                    }
                }

                if (data.stage === 'pipeline') {
                    if (data.status === 'completed') {
                        this.stages.forEach(s => { if (s.status !== 'failed') s.status = 'done'; });
                    }
                }

                this.$nextTick(() => {
                    const c = document.getElementById('log-container');
                    if (c) c.scrollTop = c.scrollHeight;
                });
            });

            es.addEventListener('done', (e) => {
                const data = JSON.parse(e.data);
                this.done = true;
                this.failed = data.status === 'failed';
                es.close();
            });

            es.onerror = () => {
                this.done = true;
                es.close();
            };
        }
    };
}
</script>
{% endblock %}
